version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.20.0
    working_directory: ~/project

jobs:
  build:
    executor: node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build static site
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deploy:
    docker:
      - image: cimg/aws:2026.07.1
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Upload static site and invalidate CloudFront
          command: |
            set -eu
            bucket=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STATIC_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
            distribution=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STATIC_STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
            : "${bucket:?Missing SiteBucketName output}"
            : "${distribution:?Missing DistributionId output}"
            aws s3 sync dist/assets/ "s3://$bucket/assets/" --region "$AWS_REGION" --cache-control "public,max-age=31536000,immutable"
            aws s3 sync dist/ "s3://$bucket/" --region "$AWS_REGION" --delete --exclude "assets/*" --cache-control "public,max-age=300"
            aws s3 cp dist/index.html "s3://$bucket/index.html" --region "$AWS_REGION" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
            aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'

workflows:
  build_and_deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
